    // --- SAVE/LOAD PROJECT ---
    saveProject() {
        const data = {
            version: 1,
            compLayers: this.compLayers.map(l => l.toJSON()),
            wireLayers: this.wireLayers.map(l => l.toJSON()),
            viewScale: this.viewScale,
            viewOffset: { x: this.viewOffset.x, y: this.viewOffset.y }
        };
        const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'circuit_project.json';
        a.click();
    }

    loadProjectFromFile(input) {
        const file = input.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                const data = JSON.parse(e.target.result);
                this.loadProject(data);
            } catch(err) {
                alert("Invalid JSON file");
                console.error(err);
            }
        };
        reader.readAsText(file);
    }

    loadProject(data) {
        // Reset
        this.wireLayers = [];
        this.compLayers = [];
        this.selectedNodes.clear();
        this.activeLayer = null;
        
        if(data.viewScale) this.viewScale = data.viewScale;
        if(data.viewOffset) this.viewOffset = new Vec2(data.viewOffset.x, data.viewOffset.y);
        
        const restoreNode = (nData) => {
            let node;
            switch(nData.type) {
                case 'Layer': 
                    node = new LayerNode(nData.name, nData.layerType);
                    node.visible = nData.visible;
                    node.opacity = nData.opacity;
                    if(nData.color) node.color = nData.color;
                    break;
                case 'Component':
                    node = new ComponentNode(nData.compType, new Vec2(nData.pos.x, nData.pos.y));
                    node.state = nData.state;
                    node.period = nData.period;
                    // Restore pins
                    node.pins = nData.pins; 
                    break;
                case 'Wire':
                    node = new WireNode(nData.mode, new Vec2(nData.start.x, nData.start.y));
                    node.length = nData.length;
                    node.width = nData.width;
                    if (nData.cells) nData.cells.forEach(c => node.cells.add(c));
                    break;
                case 'Group': node = new GroupNode(); break;
                case 'Repeat':
                    // Reconstruction of Repeater is tricky because constructor expects children
                    // We create temp empty and fill later
                    node = new RepeatNode([]);
                    node.countX = nData.countX; node.countY = nData.countY;
                    node.gapX = nData.gapX; node.gapY = nData.gapY;
                    node.shiftX = nData.shiftX; node.shiftY = nData.shiftY;
                    break;
            }
            if (node) {
                node.id = nData.id;
                node.name = nData.name;
                node.expanded = nData.expanded;
                if (nData.children) {
                    nData.children.forEach(cData => {
                        const child = restoreNode(cData);
                        if (child) {
                            child.parent = node;
                            node.children.push(child);
                        }
                    });
                }
            }
            return node;
        };

        if (data.compLayers) {
            data.compLayers.forEach(lData => this.compLayers.push(restoreNode(lData)));
        }
        if (data.wireLayers) {
            data.wireLayers.forEach(lData => this.wireLayers.push(restoreNode(lData)));
        }
        
        this.setTab('components');
    }

    checkCollision(rect, layer) {
        const blocks = layer.bake();
        const rX = rect.x * GRID;
        const rY = rect.y * GRID;
        const rW = rect.w * GRID;
        const rH = rect.h * GRID;
        for (let b of blocks) {
            if (b.type === 'body') {
                if (rX < b.x + b.w && rX + rW > b.x && rY < b.y + b.h && rY + rH > b.y) {
                    return true;
                }
            }
        }
        return false;
    }

    toggleSimulation() {
        this.simRunning = !this.simRunning;
        const btn = document.getElementById('btn-play');
        const blockerT = document.getElementById('toolbar-blocker');
        const rightPaneBlocker = document.createElement('div');
        
        if (this.simRunning) {
            const allBlocks = this.getAllBaked();
            const valid = this.simulator.buildGraph(allBlocks);
            
            if (!valid) {
                this.simRunning = false;
                return; 
            }

            btn.innerHTML = '■';
            btn.classList.remove('start');
            btn.classList.add('stop');
            btn.title = "Stop Simulation";
            
            this.selectedNodes.clear();
            this.refreshProperties();
            this.refreshHierarchy(); 
            this.updateActionButtons();
            
            blockerT.classList.add('active');
            rightPaneBlocker.id = 'right-pane-blocker';
            rightPaneBlocker.className = 'ui-blocker active';
            document.getElementById('pane-content').appendChild(rightPaneBlocker);
            
        } else {
            btn.innerHTML = '▶';
            btn.classList.remove('stop');
            btn.classList.add('start');
            btn.title = "Play Simulation";
            
            blockerT.classList.remove('active');
            const b = document.getElementById('right-pane-blocker');
            if (b) b.remove();
        }
        this.loop();
    }

    // ... existing methods ...

    setupInput() {
        const c = this.canvas;
        
        // Zoom
        c.addEventListener('wheel', e => {
            e.preventDefault();
            
            // Screen pos relative to canvas
            const rect = c.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            
            const zoomIntensity = 0.1;
            const wheel = e.deltaY < 0 ? 1 : -1;
            const zoom = Math.exp(wheel * zoomIntensity);
            
            // World pos before zoom
            const worldX = (mouseX - this.viewOffset.x) / this.viewScale;
            const worldY = (mouseY - this.viewOffset.y) / this.viewScale;
            
            this.viewScale *= zoom;
            this.viewScale = Math.max(0.1, Math.min(this.viewScale, 5.0)); // Clamp

            // Adjust offset to keep mouse world pos stable
            this.viewOffset.x = mouseX - worldX * this.viewScale;
            this.viewOffset.y = mouseY - worldY * this.viewScale;
        });

        c.addEventListener('mousemove', e => {
            if (this.isLayerMultiMode) return;
            const rect = c.getBoundingClientRect();
            const screenX = e.clientX - rect.left;
            const screenY = e.clientY - rect.top;
            
            // Transform to World
            const worldX = (screenX - this.viewOffset.x) / this.viewScale;
            const worldY = (screenY - this.viewOffset.y) / this.viewScale;
            
            this.mouse = new Vec2(worldX, worldY);
            this.mouseGrid = this.mouse.grid();

            // PANNING Logic
            if (this.isPanning) {
                const dx = screenX - this.panStart.x;
                const dy = screenY - this.panStart.y;
                this.viewOffset.x += dx;
                this.viewOffset.y += dy;
                this.panStart = { x: screenX, y: screenY };
                return;
            }

            this.updateHoverHighlight();
            
            // Tooltip Logic
            const tooltip = document.getElementById('tooltip');
            let hoveredBlock = null;
            
            // Re-run minimal hit test for tooltip (fast)
            const blocks = this.simRunning ? this.getAllBaked() : this.getAllBaked(); 
            for(let i=blocks.length-1; i>=0; i--) {
                const b = blocks[i];
                if(this.mouse.x >= b.x && this.mouse.x <= b.x+b.w && this.mouse.y >= b.y && this.mouse.y <= b.y+b.h) {
                    hoveredBlock = b;
                    break;
                }
            }

            if (hoveredBlock && hoveredBlock.layerId) {
                let layerName = "Unknown Layer";
                const layerNode = this.wireLayers.find(l => l.id === hoveredBlock.layerId) || this.compLayers.find(l => l.id === hoveredBlock.layerId);
                if (layerNode) layerName = layerNode.name;
                
                tooltip.style.display = 'block';
                tooltip.style.left = (e.clientX + 15) + 'px';
                tooltip.style.top = (e.clientY + 15) + 'px';
                tooltip.innerText = layerName;
            } else {
                tooltip.style.display = 'none';
            }

            if (this.simRunning) return; 

            if(this.activeHandle) {
                this.activeHandle.node.resize(this.activeHandle.type, this.mouseGrid);
                this.refreshProperties();
                return; 
            }

            if(this.isDrawing && this.drawingNode) {
                if(this.tool === 'draw-v') {
                    const len = this.mouseGrid.y - this.drawingNode.start.y;
                    this.drawingNode.length = Math.max(1, len + 1);
                } 
                else if(this.tool === 'draw-h') {
                    const len = this.mouseGrid.x - this.drawingNode.start.x;
                    this.drawingNode.length = Math.max(1, len + 1);
                }
                else if(this.tool === 'draw-free') {
                    this.drawingNode.addCell(this.mouseGrid); 
                }
            }
            
            if(this.isDragging && this.dragLastGrid) {
                const dx = this.mouseGrid.x - this.dragLastGrid.x;
                const dy = this.mouseGrid.y - this.dragLastGrid.y;
                if(dx !== 0 || dy !== 0) {
                    this.selectedNodes.forEach(n => n.move(dx, dy));
                    this.dragLastGrid = this.mouseGrid;
                }
            }
        });

        c.addEventListener('mousedown', e => {
            const rect = c.getBoundingClientRect();
            const screenX = e.clientX - rect.left;
            const screenY = e.clientY - rect.top;
            
            // Pan Tool or Middle Click
            if (this.tool === 'pan' || e.button === 1) {
                e.preventDefault();
                this.isPanning = true;
                this.panStart = { x: screenX, y: screenY };
                return;
            }

            if(e.button !== 0) return;
            if (this.isLayerMultiMode) return; 

            // Simulation Interaction
            if (this.simRunning) {
                const blocks = this.getAllBaked();
                for(let i=blocks.length-1; i>=0; i--) {
                    const b = blocks[i];
                    if(this.mouse.x >= b.x && this.mouse.x <= b.x+b.w && this.mouse.y >= b.y && this.mouse.y <= b.y+b.h) {
                        if (b.type === 'body' && b.compType === 'SWITCH') {
                            const uid = b.sourceId + (b.instancePath || "");
                            this.simulator.toggleSwitch(uid);
                        }
                        break;
                    }
                }
                return;
            }

            if (!this.activeLayer) {
                alert("Please select or create a layer first.");
                return;
            }

            const handleHit = this.checkHandleHit();
            if(handleHit) {
                this.activeHandle = handleHit;
                return;
            }

            // Move in Multi/Box mode logic
            const hit = this.hitTest(this.mouse, false); // active layer only
            if (hit && this.isNodeSelectedOrChildOfSelected(hit)) {
                if (this.tool === 'select' || this.tool === 'select-multi' || this.tool === 'select-box') {
                     this.isDragging = true;
                     this.dragLastGrid = this.mouseGrid;
                     return; 
                }
            }

            if(this.tool.startsWith('draw') || this.tool === 'place-comp') {
                if (this.tool === 'place-comp') {
                    const c = new ComponentNode(this.placeCompType, this.mouseGrid);
                    console.log(`[ACTION] Placing ${this.placeCompType} at ${this.mouseGrid.x},${this.mouseGrid.y}`);
                    
                    if (this.wireLayers.length > 0) {
                        const defaultLayerId = this.wireLayers[0].id;
                        c.pins.forEach(p => p.targetLayerId = defaultLayerId);
                    }

                    if (this.checkCollision({x: c.pos.x, y: c.pos.y, w: c.w, h: c.h}, this.activeLayer)) {
                        console.log("Collision detected");
                        return;
                    }

                    this.activeLayer.add(c);
                    this.selectedNodes.clear();
                    this.selectedNodes.add(c);
                    this.refreshHierarchy();
                    this.refreshProperties();
                }
                else if(this.tool === 'draw-free') {
                    console.log(`[ACTION] Drawing Free Wire start ${this.mouseGrid.x},${this.mouseGrid.y}`);
                    this.isDrawing = true;
                    this.drawingNode = new WireNode('Free', this.mouseGrid);
                    this.activeLayer.add(this.drawingNode);
                    this.selectedNodes.clear();
                    this.selectedNodes.add(this.drawingNode);
                    this.refreshHierarchy();
                } else {
                    if (!this.isDrawing) {
                        console.log(`[ACTION] Drawing ${this.tool} start ${this.mouseGrid.x},${this.mouseGrid.y}`);
                        this.isDrawing = true;
                        let mode = this.tool === 'draw-v' ? 'V' : 'H';
                        this.drawingNode = new WireNode(mode, this.mouseGrid);
                        this.activeLayer.add(this.drawingNode);
                        this.selectedNodes.clear();
                        this.selectedNodes.add(this.drawingNode);
                        this.refreshHierarchy();
                    } else {
                        console.log(`[ACTION] Drawing ${this.tool} end ${this.mouseGrid.x},${this.mouseGrid.y}`);
                        this.isDrawing = false;
                        this.drawingNode = null;
                        this.refreshHierarchy();
                        this.refreshProperties();
                    }
                }
            } 
            else if(this.tool.startsWith('select')) {
                if(this.tool === 'select-box') {
                    this.isSelectingBox = true;
                    this.boxStart = this.mouse;
                } else {
                    const hit = this.handleClickSelect(e);
                    if(hit && this.isNodeSelectedOrChildOfSelected(hit)) {
                        this.isDragging = true;
                        this.dragLastGrid = this.mouseGrid;
                    }
                }
            }
        });

        c.addEventListener('dblclick', e => {
            if (this.tool !== 'select' || this.isLayerMultiMode || this.simRunning) return;
            const blocks = this.activeLayer ? this.activeLayer.bake() : [];
            let hitId = null;
            for(let i=blocks.length-1; i>=0; i--) { 
                const b = blocks[i];
                if(this.mouse.x >= b.x && this.mouse.x <= b.x+b.w && this.mouse.y >= b.y && this.mouse.y <= b.y+b.h) {
                    hitId = b.sourceId;
                    break;
                }
            }
            if(hitId) {
                const leaf = this.findNodeById(this.activeLayer, hitId);
                if(leaf) {
                    this.selectedNodes.clear();
                    const path = leaf.getPath().filter(n => !(n instanceof LayerNode) && !(n instanceof RepeatNode));
                    this.expandToNode(leaf);
                    this.selectedNodes.add(leaf);
                    
                    this.updateActionButtons();
                    this.refreshHierarchy();
                    this.refreshProperties();
                }
            }
        });

        window.addEventListener('mouseup', () => {
            if (this.isPanning) {
                this.isPanning = false;
                return;
            }
            if (this.isLayerMultiMode) return;
            if(this.activeHandle) this.activeHandle = null;
            if(this.isDragging) {
                this.isDragging = false;
                this.refreshProperties();
            }
            if(this.isDrawing && this.tool === 'draw-free') {
                this.isDrawing = false;
                this.drawingNode = null;
                this.refreshHierarchy();
            }
            if(this.isSelectingBox && this.boxStart) {
                this.handleBoxSelect(this.boxStart, this.mouse);
                this.isSelectingBox = false;
                this.boxStart = null;
            }
        });
    }

    getAllBaked() {
        let blocks = [];
        this.compLayers.forEach(l => blocks.push(...l.bake()));
        this.wireLayers.forEach(l => blocks.push(...l.bake()));
        return blocks;
    }
    
    getActiveLayerBaked() {
        if (!this.activeLayer) return [];
        return this.activeLayer.bake();
    }

    hitTest(pos, useAllLayers = false) {
        const blocks = useAllLayers ? this.getAllBaked() : this.getActiveLayerBaked();
        let hitId = null;
        for(let i=blocks.length-1; i>=0; i--) { 
            const b = blocks[i];
            if(pos.x >= b.x && pos.x <= b.x+b.w && pos.y >= b.y && pos.y <= b.y+b.h) {
                hitId = b.sourceId;
                break;
            }
        }
        return hitId ? this.findNodeGlobally(hitId) : null;
    }

    findNodeGlobally(id) {
        let res = this.findNodeInStack(this.compLayers, id);
        if(!res) res = this.findNodeInStack(this.wireLayers, id);
        return res;
    }

    findNodeInStack(stack, id) {
        for(let l of stack) {
            if (l.id === id) return l;
            const f = this.findNodeById(l, id);
            if(f) return f;
        }
        return null;
    }

    findNodeById(node, id) {
        if(node.id === id) return node;
        for(let c of node.children) {
            const found = this.findNodeById(c, id);
            if(found) return found;
        }
        return null;
    }

    isNodeSelectedOrChildOfSelected(node) {
        let curr = node;
        while(curr) {
            if(this.selectedNodes.has(curr)) return true;
            curr = curr.parent;
        }
        return false;
    }

    checkHandleHit() {
        if(this.selectedNodes.size !== 1) return null;
        const node = this.selectedNodes.values().next().value;
        if(!(node instanceof WireNode) || node.mode === 'Free') return null;
        const handles = node.getHandles();
        const tolerance = 6 / this.viewScale; // Scaled tolerance
        for(let h of handles) {
            if(Math.abs(this.mouse.x - h.x) < tolerance && Math.abs(this.mouse.y - h.y) < tolerance) {
                return { node: node, type: h.type };
            }
        }
        return null;
    }

    updateHoverHighlight() {
        const blocks = this.getAllBaked(); 
        const gridMap = new Map(); 
        
        blocks.forEach(b => {
            const gx = Math.round(b.x / GRID);
            const gy = Math.round(b.y / GRID);
            const gw = Math.round(b.w / GRID);
            const gh = Math.round(b.h / GRID);
            for(let i=0; i<gw; i++) {
                for(let j=0; j<gh; j++) {
                    gridMap.set(`${b.layerId}:${gx+i},${gy+j}`, b); 
                }
            }
        });

        const mx = this.mouseGrid.x;
        const my = this.mouseGrid.y;
        
        let startBlock = null;
        for(let i=blocks.length-1; i>=0; i--) {
            const b = blocks[i];
            const gx = Math.round(b.x / GRID);
            const gy = Math.round(b.y / GRID);
            const gw = Math.round(b.w / GRID);
            const gh = Math.round(b.h / GRID);
            if (mx >= gx && mx < gx + gw && my >= gy && my < gy + gh) {
                startBlock = b;
                break;
            }
        }

        if (!startBlock) {
            this.hoveredCells = [];
            return;
        }

        const queue = [];
        const visited = new Set(); 
        const cluster = [];

        if (startBlock.type === 'body') {
            const node = this.findNodeGlobally(startBlock.sourceId);
            if (node instanceof ComponentNode) {
                cluster.push(startBlock);
                node.pins.forEach(p => {
                    if (p.targetLayerId) {
                        const px = node.pos.x + p.x;
                        const py = node.pos.y + p.y;
                        const key = `${p.targetLayerId}:${px},${py}`;
                        queue.push(key);
                        visited.add(key);
                    }
                });
            }
        } else {
            const startKey = `${startBlock.layerId}:${mx},${my}`;
            queue.push(startKey);
            visited.add(startKey);
        }

        while (queue.length > 0) {
            const key = queue.shift();
            if (!gridMap.has(key)) continue;
            
            const block = gridMap.get(key);
            if(!cluster.includes(block)) {
                cluster.push(block);
                if (block.type === 'pin' && block.sourceId) {
                    const body = blocks.find(b => b.sourceId === block.sourceId && b.type === 'body');
                    if (body && !cluster.includes(body)) cluster.push(body);
                }
            }

            const coordPart = key.split(':')[1];
            const layerId = key.split(':')[0];
            const [kx, ky] = coordPart.split(',').map(Number);
            
            const neighbors = [
                `${layerId}:${kx+1},${ky}`, `${layerId}:${kx-1},${ky}`, 
                `${layerId}:${kx},${ky+1}`, `${layerId}:${kx},${ky-1}`
            ];

            neighbors.forEach(nKey => {
                if (gridMap.has(nKey) && !visited.has(nKey)) {
                    visited.add(nKey);
                    queue.push(nKey);
                }
            });
        }
        this.hoveredCells = cluster;
    }

    handleClickSelect(e) {
        if (!this.activeLayer) return null;
        const blocks = this.getActiveLayerBaked();
        let hitId = null;
        for(let i=blocks.length-1; i>=0; i--) { 
            const b = blocks[i];
            if(this.mouse.x >= b.x && this.mouse.x <= b.x+b.w && this.mouse.y >= b.y && this.mouse.y <= b.y+b.h) {
                hitId = b.sourceId;
                break;
            }
        }
        const leafNode = hitId ? this.findNodeById(this.activeLayer, hitId) : null;

        if(this.tool === 'select') {
            if(leafNode) {
                const rawPath = leafNode.getPath();
                const filteredPath = rawPath.filter(n => !(n instanceof RepeatNode));
                
                // Shift Click: Select Individual Leaf (Deep Select)
                if (e.shiftKey) {
                     this.selectedNodes.clear();
                     this.selectedNodes.add(leafNode);
                     this.expandToNode(leafNode);
                } 
                // Single Click: Select Root/Group
                else {
                    const objectPath = filteredPath.filter(n => !(n instanceof LayerNode));
                    this.selectedNodes.clear();
                    if(objectPath.length > 0) this.selectedNodes.add(objectPath[0]); // Select Top Level Group
                    else this.selectedNodes.add(leafNode);
                }
            } else {
                this.selectedNodes.clear();
            }
        } else if(this.tool === 'select-multi') {
            if(leafNode) {
                if(this.selectedNodes.has(leafNode)) this.selectedNodes.delete(leafNode);
                else this.selectedNodes.add(leafNode);
            }
        }
        
        this.updateActionButtons();
        this.refreshHierarchy();
        this.refreshProperties();
        return leafNode; 
    }

    handleBoxSelect(p1, p2) {
        if (!this.activeLayer) return;
        const x = Math.min(p1.x, p2.x);
        const y = Math.min(p1.y, p2.y);
        const w = Math.abs(p1.x - p2.x);
        const h = Math.abs(p1.y - p2.y);
        const blocks = this.getActiveLayerBaked();
        const hits = new Set();
        blocks.forEach(b => {
            if (x < b.x + b.w && x + w > b.x && y < b.y + b.h && y + h > b.y) {
                 hits.add(b.sourceId);
            }
        });
        this.selectedNodes.clear();
        hits.forEach(id => {
            const leaf = this.findNodeById(this.activeLayer, id);
            if(leaf) {
                const path = leaf.getPath().filter(n => !(n instanceof LayerNode) && !(n instanceof RepeatNode));
                if(path.length > 0) this.selectedNodes.add(path[0]);
                else this.selectedNodes.add(leaf);
            }
        });
        this.updateActionButtons();
        this.refreshHierarchy();
        this.refreshProperties();
    }

    isDescendant(parent, child) {
        let curr = child.parent;
        while(curr) {
            if(curr === parent) return true;
            curr = curr.parent;
        }
        return false;
    }
    
    expandToNode(node) {
        let curr = node.parent;
        while(curr && !(curr instanceof LayerNode)) {
            curr.expanded = true;
            curr = curr.parent;
        }
        if(curr instanceof LayerNode) curr.expanded = true;
    }

    updateActionButtons() {
        const btnGroup = document.getElementById('btn-group');
        const btnRepeat = document.getElementById('btn-repeat');
        const hasLayer = Array.from(this.selectedNodes).some(n => n instanceof LayerNode);
        if (hasLayer) {
            btnGroup.style.display = 'none';
            btnRepeat.style.display = 'none';
            return;
        } else {
            btnGroup.style.display = 'inline-block';
            btnRepeat.style.display = 'inline-block';
        }
        if(this.selectedNodes.size < 2) {
            btnGroup.disabled = true;
        } else {
            const parents = new Set();
            this.selectedNodes.forEach(n => parents.add(n.parent));
            btnGroup.disabled = parents.size > 1;
        }
        if (this.selectedNodes.size === 0) {
            btnRepeat.disabled = true;
        } else {
            const parents = new Set();
            this.selectedNodes.forEach(n => parents.add(n.parent));
            btnRepeat.disabled = parents.size > 1;
        }
    }

    applyRepeat() {
        if(this.selectedNodes.size === 0) return;
        const targets = Array.from(this.selectedNodes);
        if (targets.some(n => n instanceof LayerNode)) return; 
        const parent = targets[0].parent;
        if(!targets.every(n => n.parent === parent)) { alert("Parent mismatch"); return; }
        if(!parent) return;
        targets.forEach(n => parent.children = parent.children.filter(c => c !== n));
        const rep = new RepeatNode(targets);
        parent.children.push(rep);
        rep.parent = parent;
        this.selectedNodes.clear();
        this.selectedNodes.add(rep);
        this.refreshHierarchy();
        this.refreshProperties();
    }

    groupSelection() {
        if(this.selectedNodes.size < 2) return;
        const targets = Array.from(this.selectedNodes);
        if (targets.some(n => n instanceof LayerNode)) return; 
        const parent = targets[0].parent;
        if(!targets.every(n => n.parent === parent)) return;
        if(!parent) return;
        targets.forEach(n => parent.children = parent.children.filter(c => c !== n));
        const grp = new GroupNode();
        targets.forEach(n => grp.add(n));
        parent.children.push(grp);
        grp.parent = parent;
        this.selectedNodes.clear();
        this.selectedNodes.add(grp);
        this.updateActionButtons();
        this.refreshHierarchy();
        this.refreshProperties();
    }

    deleteSelection() {
        if(this.selectedNodes.size === 0) return;
        const roots = new Set();
        this.selectedNodes.forEach(n => {
            if(!this.isNodeSelectedOrChildOfSelected(n.parent)) roots.add(n);
        });
        roots.forEach(n => {
            if(n instanceof LayerNode) {
                this.wireLayers = this.wireLayers.filter(l => l !== n);
                this.compLayers = this.compLayers.filter(l => l !== n);
                if(this.activeLayer === n) this.activeLayer = null;
            } else {
                const p = n.parent;
                if(p) p.children = p.children.filter(c => c !== n);
            }
        });
        this.selectedNodes.clear();
        this.updateActionButtons();
        this.refreshHierarchy();
        this.refreshProperties();
    }
    
    ungroupSelection() {
        if(this.selectedNodes.size === 0) return;
        const targets = Array.from(this.selectedNodes);
        targets.forEach(n => { if(n.ungroup) n.ungroup(); });
        this.selectedNodes.clear();
        this.refreshHierarchy();
        this.refreshProperties();
    }
    
    moveLayer(layer, dir) {
        const stack = layer.type === 'WIRE' ? this.wireLayers : this.compLayers;
        const idx = stack.indexOf(layer);
        if (idx === -1) return;
        if (dir === -1 && idx > 0) { 
            [stack[idx], stack[idx-1]] = [stack[idx-1], stack[idx]];
        } else if (dir === 1 && idx < stack.length - 1) {
             [stack[idx], stack[idx+1]] = [stack[idx+1], stack[idx]];
        }
        this.refreshHierarchy();
    }

    refreshHierarchy() {
        const container = document.getElementById('hierarchy-view');
        container.innerHTML = '';
        const stack = this.activeTab === 'wires' ? this.wireLayers : this.compLayers;

        const buildTree = (node, parentColor) => {
            const el = document.createElement('div');
            el.className = 'tree-node';
            const isSel = this.selectedNodes.has(node);
            const isActiveLayer = node === this.activeLayer;
            const header = document.createElement('div');
            header.className = `tree-header ${isSel ? 'selected' : ''}`;
            
            if (node instanceof LayerNode) {
                header.style.fontWeight = isActiveLayer ? 'bold' : 'normal';
                header.style.color = isActiveLayer ? '#fff' : '#888';
                if (this.isLayerMultiMode) {
                    el.classList.add('pointer-events-none');
                    header.style.pointerEvents = 'auto'; 
                }
            } else {
                if (this.isLayerMultiMode) return document.createTextNode(''); 
            }

            header.onclick = (e) => {
                e.stopPropagation();
                if (this.isLayerMultiMode) {
                    if (node instanceof LayerNode) {
                        if (this.selectedNodes.has(node)) this.selectedNodes.delete(node);
                        else this.selectedNodes.add(node);
                        this.refreshHierarchy();
                        this.refreshProperties();
                        this.updateActionButtons();
                    }
                    return;
                }
                if (node instanceof LayerNode) {
                    this.activeLayer = node;
                    if(e.shiftKey || this.tool === 'select-multi') {
                         if (this.selectedNodes.has(node)) this.selectedNodes.delete(node);
                         else this.selectedNodes.add(node);
                    } else {
                        this.selectedNodes.clear();
                        this.selectedNodes.add(node);
                    }
                    this.refreshHierarchy();
                    this.refreshProperties();
                    this.updateActionButtons();
                    return;
                }
                if (this.tool === 'select-multi') {
                    if (node instanceof GroupNode || node instanceof RepeatNode) return;
                    if (this.selectedNodes.has(node)) this.selectedNodes.delete(node);
                    else this.selectedNodes.add(node);
                } else {
                    if(e.shiftKey) {
                        if(this.selectedNodes.has(node)) this.selectedNodes.delete(node);
                        else this.selectedNodes.add(node);
                    } else {
                        this.selectedNodes.clear();
                        this.selectedNodes.add(node);
                    }
                }
                this.updateActionButtons();
                this.refreshHierarchy();
                this.refreshProperties();
            };

            // Dynamic color selection logic
            let color = '#888';
            if(node instanceof LayerNode) color = node.color || '#fff'; // Use layer color
            else if(parentColor) color = parentColor; // Inherit from layer if passed down
            
            // Fallbacks/Overrides
            if(node instanceof RepeatNode) color = '#facc15';
            if(node instanceof GroupNode) color = '#60a5fa';

            const toggleVis = (e) => {
                e.stopPropagation();
                node.visible = !node.visible;
                this.refreshHierarchy(); 
                this.loop();
            };

            const eyeIcon = node instanceof LayerNode 
                ? `<span class="tree-vis ${!node.visible ? 'hidden-layer' : ''}" onclick="/*handled below*/">👁</span>`
                : '';

            header.innerHTML = `
                <span class="tree-toggle" onclick="app.toggleNode('${node.id}')">
                    ${node.children.length > 0 ? (node.expanded ? '▼' : '▶') : '•'}
                </span>
                ${eyeIcon}
                <div class="tree-icon" style="background:${color}; ${node instanceof LayerNode ? 'border-radius:50%;' : ''}"></div>
                <span>${node.name}</span>
            `;
            
            if(node instanceof LayerNode) {
                const eye = header.querySelector('.tree-vis');
                eye.onclick = toggleVis;
            }

            el.appendChild(header);

            if(node.expanded && node.children.length > 0 && !this.isLayerMultiMode) {
                const cDiv = document.createElement('div');
                if(node instanceof WireNode && node.mode === 'Free') {
                    const sortedCells = Array.from(node.cells).sort();
                    sortedCells.forEach(cellStr => {
                        const row = document.createElement('div');
                        row.className = 'tree-cell-item';
                        row.innerText = `Cell (${cellStr})`;
                        cDiv.appendChild(row);
                    });
                }
                // Pass current color down if this is a LayerNode, otherwise pass the received parentColor
                const nextColor = node instanceof LayerNode ? node.color : parentColor;
                [...node.children].reverse().forEach(c => cDiv.appendChild(buildTree(c, nextColor)));
                el.appendChild(cDiv);
            }
            return el;
        };

        [...stack].reverse().forEach(l => container.appendChild(buildTree(l, null)));
    }

    toggleNode(id) {
        const n = this.findNodeGlobally(id);
        if(n) { n.expanded = !n.expanded; this.refreshHierarchy(); }
    }

    refreshProperties() {
        const container = document.getElementById('properties-view');
        container.innerHTML = '';
        if(this.selectedNodes.size === 0) {
            container.innerHTML = '<div class="text-gray-500 text-xs italic text-center mt-4">Select object(s)</div>';
            return;
        }
        
        if (this.isLayerMultiMode) {
            this.addHeader(container, 'MULTI LAYER EDIT');
            const layers = Array.from(this.selectedNodes).filter(n => n instanceof LayerNode);
            if (layers.length > 0) {
                this.addProp(container, 'Bulk Opacity', 'range', layers[0].opacity, (v) => {
                    layers.forEach(l => l.opacity = parseFloat(v));
                    this.loop();
                }, {min:0, max:1, step:0.1});
            }
            return;
        }

        if(this.selectedNodes.size > 1) {
            container.innerHTML = `<div class="text-white text-xs text-center mt-4">${this.selectedNodes.size} items selected</div>`;
            return;
        }

        const node = this.selectedNodes.values().next().value;
        this.addProp(container, 'Name', 'text', node.name, (v) => { node.name = v; this.refreshHierarchy(); });

        if(node instanceof LayerNode) {
            this.addHeader(container, 'LAYER SETTINGS');
            this.addProp(container, 'Color', 'color', node.color, (v) => { node.color = v; this.refreshHierarchy(); this.loop(); });
            this.addProp(container, 'Opacity', 'range', node.opacity, (v) => { node.opacity = parseFloat(v); this.loop(); }, {min:0, max:1, step:0.1});
            
            const row = document.createElement('div');
            row.className = 'flex gap-2 mt-2';
            const btnUp = document.createElement('button');
            btnUp.className = 'action-btn'; btnUp.innerText = 'Move Up'; 
            btnUp.onclick = () => app.moveLayer(node, 1);
            const btnDown = document.createElement('button');
            btnDown.className = 'action-btn'; btnDown.innerText = 'Move Down'; 
            btnDown.onclick = () => app.moveLayer(node, -1);
            row.appendChild(btnUp); row.appendChild(btnDown);
            container.appendChild(row);
        }
        else if(node instanceof ComponentNode) {
            this.addHeader(container, 'COMPONENT');
            this.addProp(container, 'Type', 'label', node.compType);
            this.addProp(container, 'Pos X', 'number', node.pos.x, (v) => node.pos.x = parseInt(v));
            this.addProp(container, 'Pos Y', 'number', node.pos.y, (v) => node.pos.y = parseInt(v));
            
            if (node.compType === 'CLOCK') {
                this.addProp(container, 'Period', 'number', node.period, (v) => node.period = parseInt(v));
            }

            this.addHeader(container, 'CONNECTIONS');
            node.pins.forEach(pin => {
                const row = document.createElement('div');
                row.className = 'prop-row';
                const lbl = document.createElement('span');
                lbl.className = 'text-gray-400 text-[10px]';
                lbl.innerText = `${pin.id} (${pin.type})`;
                
                const select = document.createElement('select');
                select.className = 'prop-select';
                
                const noneOpt = document.createElement('option');
                noneOpt.value = ''; noneOpt.text = '-- None --';
                select.appendChild(noneOpt);
                
                this.wireLayers.forEach(l => {
                    const opt = document.createElement('option');
                    opt.value = l.id;
                    opt.text = l.name;
                    if (pin.targetLayerId === l.id) opt.selected = true;
                    select.appendChild(opt);
                });
                
                select.onchange = (e) => {
                    console.log(`[ACTION] Changed Pin ${pin.id} Layer to ${e.target.value}`);
                    pin.targetLayerId = e.target.value;
                };
                
                row.appendChild(lbl);
                row.appendChild(select);
                container.appendChild(row);
            });
        }
        else if(node instanceof WireNode) {
            if(node.mode !== 'Free') {
                this.addHeader(container, 'GEOMETRY');
                this.addProp(container, 'Start X', 'number', node.start.x, (v) => node.start.x = parseInt(v));
                this.addProp(container, 'Start Y', 'number', node.start.y, (v) => node.start.y = parseInt(v));
                this.addProp(container, 'Length', 'number', node.length, (v) => node.length = parseInt(v));
                this.addProp(container, 'Width', 'number', node.width, (v) => node.width = parseInt(v));
            } else {
                this.addHeader(container, 'PAINTED CELLS');
                this.addProp(container, 'Count', 'label', node.cells.size);
            }
        }
        else if(node instanceof RepeatNode) {
            this.addHeader(container, 'REPEAT CONFIG');
            this.addProp(container, 'Count X', 'number', node.countX, (v) => node.countX = parseInt(v));
            this.addProp(container, 'Gap X', 'number', node.gapX, (v) => node.gapX = parseInt(v));
            this.addProp(container, 'Shift Y', 'number', node.shiftY, (v) => node.shiftY = parseInt(v));
            this.addSeparator(container);
            this.addProp(container, 'Count Y', 'number', node.countY, (v) => node.countY = parseInt(v));
            this.addProp(container, 'Gap Y', 'number', node.gapY, (v) => node.gapY = parseInt(v));
            this.addProp(container, 'Shift X', 'number', node.shiftX, (v) => node.shiftX = parseInt(v));
            const btn = document.createElement('button');
            btn.className = 'action-btn'; btn.innerText = 'Ungroup / Remove'; btn.onclick = () => app.ungroupSelection();
            container.appendChild(btn);
        }
        else if(node instanceof GroupNode) {
            const btn = document.createElement('button');
            btn.className = 'action-btn'; btn.innerText = 'Ungroup'; btn.onclick = () => app.ungroupSelection();
            container.appendChild(btn);
        }
    }

    addProp(parent, label, type, val, callback, attrs={}) {
        const row = document.createElement('div');
        row.className = 'prop-row';
        const lbl = document.createElement('span');
        lbl.className = 'text-gray-400';
        lbl.innerText = label;
        let input;
        if(type === 'label') { input = document.createElement('span'); input.innerText = val; } 
        else {
            input = document.createElement('input');
            input.type = type;
            if(type === 'number') input.value = val;
            else if(type === 'checkbox') input.checked = val;
            else input.value = val;
            
            if(type === 'text' || type === 'number') input.className = 'prop-input';
            else if(type === 'range') input.className = 'w-16 accent-accent'; 
            else if(type === 'color') input.className = 'w-8 h-4 p-0 border-0 bg-transparent cursor-pointer';
            
            Object.keys(attrs).forEach(k => input.setAttribute(k, attrs[k]));

            input.oninput = (e) => callback(e.target.value);
        }
        row.appendChild(lbl); row.appendChild(input); parent.appendChild(row);
    }
    addHeader(parent, text) {
        const d = document.createElement('div');
        d.className = 'text-[9px] font-bold text-accent mt-3 mb-1 border-b border-gray-700 pb-1';
        d.innerText = text;
        parent.appendChild(d);
    }
    addSeparator(parent) { const d = document.createElement('div'); d.className = 'h-px bg-gray-700 my-2'; parent.appendChild(d); }

    loop() {
        if (this.simRunning) {
            this.simulator.step();
        }
        this.draw();
        requestAnimationFrame(this.loop);
    }

    draw() {
        const ctx = this.ctx;
        
        ctx.save(); // Save for Transform
        
        // Clear Background
        ctx.fillStyle = '#111';
        ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

        // Apply Zoom/Pan Transform
        ctx.translate(this.viewOffset.x, this.viewOffset.y);
        ctx.scale(this.viewScale, this.viewScale);

        // Draw Infinite Grid
        const startX = -this.viewOffset.x / this.viewScale;
        const startY = -this.viewOffset.y / this.viewScale;
        const endX = (this.canvas.width - this.viewOffset.x) / this.viewScale;
        const endY = (this.canvas.height - this.viewOffset.y) / this.viewScale;

        const startCol = Math.floor(startX / GRID);
        const endCol = Math.ceil(endX / GRID);
        const startRow = Math.floor(startY / GRID);
        const endRow = Math.ceil(endY / GRID);

        ctx.strokeStyle = '#222'; 
        ctx.lineWidth = 1 / this.viewScale; 
        ctx.beginPath();

        for(let c = startCol; c <= endCol; c++) {
            ctx.moveTo(c * GRID, startY);
            ctx.lineTo(c * GRID, endY);
        }
        for(let r = startRow; r <= endRow; r++) {
            ctx.moveTo(startX, r * GRID);
            ctx.lineTo(endX, r * GRID);
        }
        ctx.stroke();

        // Render Layers
        const blocks = this.simRunning ? this.getAllBaked() : this.getAllBaked(); 
        
        blocks.forEach(b => {
            const leaf = this.findNodeGlobally(b.sourceId);
            const isSel = leaf && this.isNodeSelectedOrChildOfSelected(leaf);
            
            ctx.globalAlpha = b.opacity !== undefined ? b.opacity : 1.0;
            
            if (b.isPin) {
                // Pin: No stroke, Yellow
                ctx.fillStyle = '#facc15';
                ctx.fillRect(b.x, b.y, b.w, b.h);
            } else if (b.type === 'wire') {
                // Wire: No stroke
                let color = b.color; // Layer color
                if (this.simRunning) {
                    const gx = Math.round(b.x/GRID);
                    const gy = Math.round(b.y/GRID);
                    const key = `${b.layerId}:${gx},${gy}`;
                    const netId = this.simulator.netMap.get(key);
                    if (this.simulator.nets.get(netId) === 1) {
                        color = '#ffffff'; 
                    }
                }
                ctx.fillStyle = isSel ? '#ffffff' : color;
                ctx.fillRect(b.x, b.y, b.w, b.h);
            } else {
                // Components: Keep Stroke
                ctx.fillStyle = isSel ? '#ffffff' : b.color;
                
                if (b.compType === 'SWITCH' && this.simRunning) {
                    const uid = b.sourceId + (b.instancePath || "");
                    const simComp = this.simulator.components.get(uid);
                    if (simComp && simComp.state) ctx.fillStyle = '#4ade80';
                    else if (simComp) ctx.fillStyle = '#1f2937';
                }
                
                if (b.compType === 'LED' && this.simRunning) {
                    const uid = b.sourceId + (b.instancePath || "");
                    const simComp = this.simulator.components.get(uid);
                    if (simComp && simComp.state) {
                        ctx.fillStyle = '#ffffff'; // On
                    } else {
                        ctx.fillStyle = '#000000'; // Off
                    }
                }

                ctx.fillRect(b.x, b.y, b.w, b.h);
                ctx.lineWidth = 1 / this.viewScale; // Scale stroke
                
                // Border Color
                if (b.compType === 'LED' && this.simRunning) {
                     const uid = b.sourceId + (b.instancePath || "");
                     const simComp = this.simulator.components.get(uid);
                     if (simComp && simComp.state) ctx.strokeStyle = '#ef4444';
                     else ctx.strokeStyle = '#ffffff';
                     ctx.strokeRect(b.x, b.y, b.w, b.h);
                } else {
                    ctx.strokeStyle = b.layerColor || '#000'; 
                    ctx.strokeRect(b.x, b.y, b.w, b.h);
                }
            }
            
            if(b.type === 'body' && leaf && leaf instanceof ComponentNode) {
                ctx.fillStyle = isSel ? '#000' : '#fff'; 
                ctx.font = (10) + 'px Arial'; 
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(leaf.compType.substr(0,4), b.x + b.w/2, b.y + b.h/2);
            }

            ctx.globalAlpha = 1.0;
        });

        if(this.hoveredCells.length > 0 && !this.simRunning) {
            ctx.strokeStyle = '#ffff00'; 
            ctx.lineWidth = 2 / this.viewScale;
            this.hoveredCells.forEach(b => ctx.strokeRect(b.x, b.y, b.w, b.h));
        }

        if(!this.simRunning && this.selectedNodes.size === 1) {
            const node = this.selectedNodes.values().next().value;
            if(node instanceof WireNode && node.mode !== 'Free') {
                const handles = node.getHandles();
                handles.forEach(h => {
                    const s = 8 / this.viewScale; // Scale handle size visually
                    const hs = s/2;
                    ctx.fillStyle = '#007acc'; ctx.fillRect(h.x - hs, h.y - hs, s, s);
                    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1 / this.viewScale; 
                    ctx.strokeRect(h.x - hs, h.y - hs, s, s);
                });
            }
        }

        if(this.isSelectingBox && this.boxStart && this.mouse) {
            const x = Math.min(this.boxStart.x, this.mouse.x);
            const y = Math.min(this.boxStart.y, this.mouse.y);
            const w = Math.abs(this.boxStart.x - this.mouse.x);
            const h = Math.abs(this.boxStart.y - this.mouse.y);
            
            ctx.fillStyle = 'rgba(0, 122, 204, 0.2)'; 
            ctx.fillRect(x, y, w, h);
            ctx.strokeStyle = '#007acc'; 
            ctx.lineWidth = 1 / this.viewScale;
            ctx.strokeRect(x, y, w, h);
        }
        
        ctx.restore();
    }
}

const app = new App();
window.app = app;
</script>
